name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  rust:
    name: Rust (fmt, clippy, test, wasm build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The toolchain is pinned in rust-toolchain.toml and the Stellar CLI in
      # stellar-cli.version (#58); read both so there is one checked-in source
      # of truth instead of a repo variable with a fallback.
      - name: Read pinned toolchain versions
        id: pinned
        run: |
          echo "rust=$(sed -n 's/^channel = "\(.*\)"/\1/p' rust-toolchain.toml)" >> "$GITHUB_OUTPUT"
          echo "stellar_cli=$(tr -d '[:space:]' < stellar-cli.version)" >> "$GITHUB_OUTPUT"

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ steps.pinned.outputs.rust }}
          targets: wasm32v1-none
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2

      # Installed the same way this repo's contributors install it locally
      # (`cargo install stellar-cli` — verified against the actual crate
      # name behind the `stellar` binary, not a guessed GitHub Action).
      - name: Install stellar CLI
        run: cargo install --locked stellar-cli --version ${{ steps.pinned.outputs.stellar_cli }}

      - name: cargo fmt --check
        run: cargo fmt --check

      - name: cargo clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: cargo test
        run: cargo test --workspace

      - name: Build all contracts to wasm
        run: |
          stellar contract build
          ./scripts/sync-vendored-wasm.sh
          stellar contract build

      - name: Fail if vendored wasm or its hash pin drifted from the build
        run: |
          git diff --exit-code -- \
            contracts/resolver/market_core.wasm \
            contracts/treasury/market_core.wasm \
            contracts/resolver/reasoning_registry.wasm \
            contracts/resolver/market_core.wasm.sha256 \
            contracts/treasury/market_core.wasm.sha256 \
            contracts/resolver/reasoning_registry.wasm.sha256

      - name: A stale vendored wasm is a compile error (#58 negative test)
        run: ./scripts/ci/assert-stale-wasm-fails.sh

      - uses: actions/upload-artifact@v4
        with:
          name: contract-wasm
          path: target/wasm32v1-none/release/*.wasm

  reproducible-wasm:
    name: Reproducible wasm (two clean builds)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Read pinned toolchain versions
        id: pinned
        run: |
          echo "rust=$(sed -n 's/^channel = "\(.*\)"/\1/p' rust-toolchain.toml)" >> "$GITHUB_OUTPUT"
          echo "stellar_cli=$(tr -d '[:space:]' < stellar-cli.version)" >> "$GITHUB_OUTPUT"

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ steps.pinned.outputs.rust }}
          targets: wasm32v1-none

      - name: Install stellar CLI
        run: cargo install --locked stellar-cli --version ${{ steps.pinned.outputs.stellar_cli }}

      # Builds the workspace twice into separate target directories, compares
      # every wasm byte-for-byte, then checks the vendored copies against a
      # clean build. This is what makes the "vendored wasm drifted" check
      # meaningful: without reproducibility it would fail on noise (#58).
      - name: Prove the build is deterministic
        run: ./scripts/check-wasm-determinism.sh

  python-model:
    name: Python FPMM model
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python3 model/fpmm_model.py
      - run: python3 model/fpmm_bounds.py --quick

  node:
    name: Node (x402, agents)
    runs-on: ubuntu-latest
    needs: rust
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/download-artifact@v4
        with:
          name: contract-wasm
          path: target/wasm32v1-none/release

      - name: Generate bindings from the built wasm
        run: |
          chmod +x scripts/gen-bindings.sh
          ./scripts/gen-bindings.sh

      - name: Fail if committed bindings are stale
        run: git diff --exit-code -- packages/bindings

      - name: Install and build bindings packages
        run: |
          for pkg in market-core resolver treasury reasoning-registry timelock router; do
            (cd "packages/bindings/$pkg" && npm install && npm run build)
          done

      - name: x402 — install, typecheck, test
        run: |
          cd x402
          npm ci
          npm run build
          npm test

      - name: agents — install, typecheck, test
        run: |
          cd agents
          npm install
          npm run build
          npm test
