name: Formal models (resolver, governance)

# Model checks of the resolution lifecycle and the governance protocols
# (oracledesk-stellar/docs/formal). Runs only when a contract a model mirrors,
# a model, or the runner changes.

on:
  pull_request:
    paths:
      - "oracledesk-stellar/contracts/resolver/**"
      - "oracledesk-stellar/contracts/market-core/**"
      - "oracledesk-stellar/contracts/timelock/**"
      - "oracledesk-stellar/contracts/treasury/**"
      - "oracledesk-stellar/contracts/reasoning-registry/**"
      - "oracledesk-stellar/docs/formal/**"
      - "oracledesk-stellar/scripts/formal.sh"
      - ".github/workflows/formal.yml"

jobs:
  tlc:
    name: TLC model check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: make formal
        working-directory: oracledesk-stellar
        run: make formal
