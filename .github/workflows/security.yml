name: Supply-Chain Security

on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop, main]
  schedule:
    - cron: "0 6 * * 1"

permissions:
  contents: read

jobs:
  cargo-deny:
    name: Rust cargo-deny (advisories, licenses, bans, sources)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: oracledesk-stellar
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: ~/.cargo/advisory-db
          key: cargo-advisory-db-${{ runner.os }}
      - uses: EmbarkStudios/cargo-deny-action@e6d236a352f211a8474c25d9a15a1c445c43a3c3 # v2.0.12
        with:
          manifest-path: oracledesk-stellar/Cargo.toml
          arguments: --config oracledesk-stellar/deny.toml
      - uses: EmbarkStudios/cargo-deny-action@e6d236a352f211a8474c25d9a15a1c445c43a3c3 # v2.0.12
        with:
          manifest-path: oracledesk-stellar/scripts/spec-hash/Cargo.toml
          arguments: --config oracledesk-stellar/deny.toml

  npm-audit:
    name: npm audit gate (production dependencies)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: oracledesk-stellar
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
      - name: Run npm audit gate unit tests
        run: node --test scripts/npm-audit-gate.test.mjs
      - name: Run npm audit gate across all lockfiles
        env:
          NPM_AUDIT_STRICT_NETWORK: ${{ github.event_name == 'schedule' && '1' || '0' }}
        run: node scripts/npm-audit-gate.mjs

  gitleaks:
    name: Secrets scan (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
      - name: Scan PR diff or branch history with gitleaks
        uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2.3.9
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_CONFIG: .gitleaks.toml
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: false

  sbom:
    name: Generate CycloneDX SBOMs (Rust + npm)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: oracledesk-stellar
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: dtolnay/rust-toolchain@631a55b12751854ce901bb631d5907c079ce0327 # master
        with:
          toolchain: stable
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
      - name: Generate Rust CycloneDX SBOM
        run: |
          mkdir -p sbom
          cargo install --locked cargo-cyclonedx
          cargo cyclonedx --format json --override-filename oracledesk-rust-sbom
          mv oracledesk-rust-sbom.cdx.json sbom/ 2>/dev/null || find . -maxdepth 3 -name "*oracledesk-rust-sbom*.json" -exec mv {} sbom/ \;
      - name: Generate npm CycloneDX SBOMs
        run: |
          mkdir -p sbom
          for pkg in x402 agents; do
            (cd "$pkg" && npx --yes @cyclonedx/cyclonedx-npm --omit dev --output-file "../sbom/${pkg}-sbom.cdx.json") || true
          done
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: sbom
          path: oracledesk-stellar/sbom/*.json
          if-no-files-found: warn
